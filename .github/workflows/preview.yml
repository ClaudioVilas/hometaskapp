name: Preview Home Task

on:
  push:
    branches: [feat/claudio-category-filter]
  workflow_dispatch: {}

concurrency:
  group: hometask-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/feat/claudio-category-filter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - name: Apply migrations to isolated preview database
        run: npx wrangler d1 migrations apply hometaskapp-preview-db --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy preview
        run: npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
